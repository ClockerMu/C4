<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Projetos Automático</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0b0f19 0%, #111827 100%);
            --card-bg: rgba(22, 30, 49, 0.7);
            --card-border: rgba(255, 255, 255, 0.05);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --radius-lg: 16px;
            --radius-md: 10px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            padding: 3rem 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1040px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.05em;
        }

        .header-actions {
            display: flex;
            gap: 0.75rem;
        }

        .btn {
            color: white;
            border: none;
            padding: 0.65rem 1.25rem;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: var(--transition);
        }

        .btn-primary {
            background: var(--accent);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25);
        }

        .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
        }

        .btn-secondary:hover { background: rgba(255, 255, 255, 0.1); }

        /* Grid e Cards */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            backdrop-filter: blur(16px);
            transition: var(--transition);
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: rgba(59, 130, 246, 0.3);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .card-emoji {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            background: rgba(255, 255, 255, 0.03);
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: var(--transition);
        }

        .card:hover .card-emoji { transform: scale(1.08); }

        .card-title {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .card-url {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .btn-edit {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            transition: var(--transition);
            color: white;
        }

        .card:hover .btn-edit { opacity: 1; }
        .btn-edit:hover { background: var(--accent); }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(7, 10, 19, 0.7);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: var(--transition);
            z-index: 100;
        }

        .modal-overlay.active { opacity: 1; pointer-events: all; }

        .modal {
            background: #161e31;
            border: 1px solid var(--card-border);
            padding: 2rem;
            border-radius: var(--radius-lg);
            width: 90%;
            max-width: 420px;
            transform: scale(0.95);
            transition: var(--transition);
        }

        .modal-overlay.active .modal { transform: scale(1); }

        .modal h3 { margin-bottom: 1.5rem; font-size: 1.25rem; }

        .form-group {
            margin-bottom: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            position: relative;
        }

        .form-group label { font-size: 0.85rem; color: var(--text-muted); }

        .form-group input {
            background: #0b0f19;
            border: 1px solid var(--card-border);
            padding: 0.75rem;
            border-radius: var(--radius-md);
            color: white;
            font-size: 0.95rem;
        }

        .form-group input:focus { outline: none; border-color: var(--accent); }

        /* Seletor de Emoji Customizado e Fluido */
        .emoji-trigger {
            background: #0b0f19;
            border: 1px solid var(--card-border);
            padding: 0.75rem;
            border-radius: var(--radius-md);
            font-size: 1.5rem;
            cursor: pointer;
            text-align: left;
            transition: var(--transition);
        }
        .emoji-trigger:hover { border-color: rgba(255,255,255,0.2); }

        .emoji-picker-box {
            position: absolute;
            top: 75px;
            left: 0;
            background: #1f2a45;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: var(--radius-md);
            padding: 0.7rem;
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 0.4rem;
            z-index: 10;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            max-height: 180px;
            overflow-y: auto;
            opacity: 0;
            transform: translateY(-5px);
            pointer-events: none;
            transition: var(--transition);
        }

        .emoji-picker-box.open {
            opacity: 1;
            transform: translateY(0);
            pointer-events: all;
        }

        .emoji-option {
            font-size: 1.3rem;
            padding: 0.3rem;
            cursor: pointer;
            border-radius: 6px;
            text-align: center;
            transition: var(--transition);
        }
        .emoji-option:hover { background: rgba(255,255,255,0.1); transform: scale(1.15); }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
            margin-top: 2rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Meus Projetos</h1>
            <div class="header-actions">
                <input type="file" id="folderScanner" webkitdirectory directory multiple style="display: none;">
                <button class="btn btn-secondary" onclick="document.getElementById('folderScanner').click()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                    Escanear Pasta
                </button>
                <button class="btn btn-primary" onclick="openModal(false)">
                    Criar Manual
                </button>
            </div>
        </header>

        <div class="grid" id="linksGrid"></div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h3 id="modalTitle">Editar Página</h3>
            <form id="linkForm" onsubmit="saveLink(event)">
                <input type="hidden" id="editId">
                
                <div class="form-group">
                    <label>Escolha o Ícone</label>
                    <div class="emoji-trigger" id="emojiBtn" onclick="toggleEmojiPicker(event)">🚀</div>
                    <input type="hidden" id="pageEmoji" value="🚀">
                    
                    <div class="emoji-picker-box" id="emojiPicker">
                        </div>
                </div>

                <div class="form-group">
                    <label for="pageName">Nome da Página</label>
                    <input type="text" id="pageName" required placeholder="Ex: Meu Portfólio">
                </div>
                <div class="form-group">
                    <label for="pageUrl">Caminho / Link arquivo</label>
                    <input type="text" id="pageUrl" required placeholder="Ex: projeto.html">
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Banco de emojis para o seletor rápido
        const emojiList = ['🚀','🏠','🧑‍💻','📁','🎨','⚙️','📊','🌐','📝','🛠️','🔥','✨','📦','📱','💻','🔑','💡','🔔','🛒','🎮','🎬'];
        
        let links = JSON.parse(localStorage.getItem('auto_indexed_links')) || [
            { id: 1, name: 'Exemplo Indexado', url: 'index.html', emoji: '✨' }
        ];

        const grid = document.getElementById('linksGrid');
        const modalOverlay = document.getElementById('modalOverlay');
        const emojiPicker = document.getElementById('emojiPicker');
        const pageEmojiInput = document.getElementById('pageEmoji');
        const emojiBtn = document.getElementById('emojiBtn');

        // Inicializa o seletor de emojis
        function initEmojiPicker() {
            emojiPicker.innerHTML = '';
            emojiList.forEach(emoji => {
                const span = document.createElement('span');
                span.className = 'emoji-option';
                span.innerText = emoji;
                span.onclick = (e) => {
                    e.stopPropagation();
                    selectEmoji(emoji);
                };
                emojiPicker.appendChild(span);
            });
        }

        function toggleEmojiPicker(e) {
            e.stopPropagation();
            emojiPicker.classList.toggle('open');
        }

        function selectEmoji(emoji) {
            pageEmojiInput.value = emoji;
            emojiBtn.innerText = emoji;
            emojiPicker.classList.remove('open');
        }

        // Fecha o seletor ao clicar fora
        document.addEventListener('click', () => emojiPicker.classList.remove('open'));

        // Renderiza os Cards na Tela
        function renderLinks() {
            grid.innerHTML = '';
            links.forEach(link => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = (e) => {
                    if(!e.target.closest('.btn-edit')) window.location.href = link.url;
                };

                card.innerHTML = `
                    <button class="btn-edit">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                    </button>
                    <div class="card-emoji">${link.emoji}</div>
                    <div class="card-title" title="${link.name}">${link.name}</div>
                    <div class="card-url">${link.url}</div>
                `;

                card.querySelector('.btn-edit').onclick = () => openModal(true, link.id);
                grid.appendChild(card);
            });
        }

        // Escaneamento Automático de Pasta
        document.getElementById('folderScanner').addEventListener('change', function(e) {
            const files = e.target.files;
            let novosItens = 0;

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                
                // Filtra apenas os arquivos na raiz ou subpastas que terminam com .html
                if (file.name.endsWith('.html')) {
                    // Evita duplicar arquivos que já estão indexados
                    const jaExiste = links.some(l => l.url === file.name);
                    
                    if (!jaExiste) {
                        const newId = links.length > 0 ? Math.max(...links.map(l => l.id)) + 1 : 1;
                        
                        // Limpa o nome do arquivo para exibição bonita (remove o .html)
                        let nomeAmigavel = file.name.replace('.html', '');
                        nomeAmigavel = nomeAmigavel.charAt(0).toUpperCase() + nomeAmigavel.slice(1);

                        links.push({
                            id: newId,
                            name: nomeAmigavel,
                            url: file.name,
                            emoji: '📄' // Ícone padrão para novos arquivos automáticos
                        });
                        novosItens++;
                    }
                }
            }

            if (novosItens > 0) {
                saveToStorage();
                renderLinks();
            }
        });

        // Modal Controls
        function openModal(isEdit, id = null) {
            modalOverlay.classList.add('active');
            if (isEdit) {
                document.getElementById('modalTitle').innerText = 'Editar Página';
                const link = links.find(l => l.id === id);
                document.getElementById('editId').value = link.id;
                document.getElementById('pageName').value = link.name;
                document.getElementById('pageUrl').value = link.url;
                selectEmoji(link.emoji);
            } else {
                document.getElementById('modalTitle').innerText = 'Adicionar Página';
                document.getElementById('linkForm').reset();
                document.getElementById('editId').value = '';
                selectEmoji('🚀');
            }
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
            emojiPicker.classList.remove('open');
        }

        function saveLink(event) {
            event.preventDefault();
            const id = document.getElementById('editId').value;
            const name = document.getElementById('pageName').value;
            const url = document.getElementById('pageUrl').value;
            const emoji = pageEmojiInput.value;

            if (id) {
                links = links.map(l => l.id == id ? { id: Number(id), name, url, emoji } : l);
            } else {
                const newId = links.length > 0 ? Math.max(...links.map(l => l.id)) + 1 : 1;
                links.push({ id: newId, name, url, emoji });
            }

            saveToStorage();
            renderLinks();
            closeModal();
        }

        function saveToStorage() {
            localStorage.setItem('auto_indexed_links', JSON.stringify(links));
        }

        // Init
        initEmojiPicker();
        renderLinks();
    </script>
</body>
</html>
